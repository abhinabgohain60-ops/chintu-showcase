<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chintu Showcase - Autonomous AI Engineer</title>
    <style>
        * { box-sizing: border-box; }
        body { overflow-x: hidden; width: 100vw; margin: 0; padding: 0; font-family: sans-serif; color: #ffffff; background-color: #0b0f19; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: no; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        header { padding: 40px 0; text-align: center; }
        h1 { font-size: 2.5rem; margin-bottom: 16px; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 1.1rem; max-width: 600px; margin: 0 auto 32px auto; }
        .hero-buttons { display: flex; gap: 16px; justify-content: center; align-items: center; margin-bottom: 48px; }
        .btn { padding: 12px 24px; font-size: 1rem; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: transform 0.2s, opacity 0.2s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="container">
        <header>
            <h1>Chintu Autonomous Agent</h1>
            <p>Self-Improving Engineering Architecture</p>
            <div class="hero-buttons">
                <a href="https://github.com/abhinabgohain60-ops/chintu-showcase" class="btn btn-primary">View Source</a>
            </div>
        </header>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        console.log("Thre.js loaded successfully.");
    </script>
</body>
</html>
